<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-zh="Sakuga 按钮" data-ja="Sakuga ボタン">Sakuga Button</title>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../i18n.css">
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 260px; padding: 40px 0; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <nav data-language-switch></nav>
  <h1 data-zh="按钮" data-ja="ボタン">Button</h1>
  <p class="sub" data-zh="按下按钮，像动画里的冲击帧一样迸发特效。" data-ja="ボタンを押すと、アニメのインパクトフレームのような演出が弾けます。">A button that reacts like an anime impact frame.</p>
  <div class="stage">
  <sakuga-button id="el" data-i18n="confirm">Confirm</sakuga-button>
  <sakuga-button variant="secondary" id="el2" data-i18n="cancel">Cancel</sakuga-button>
  </div>
  <p class="hint"><span data-zh="点击「确认」，0.76 秒后按钮会出现对勾。在实际页面中，操作成功后可以调用 " data-ja="「確定」を押すと、0.76 秒後にチェックマークが表示されます。実際のページでは、処理が成功したときに ">Click Confirm. On this page a check lands on it 0.76 seconds later, the way a real page would call </span><code>el.done()</code><span data-zh=" 来显示对勾。" data-ja=" を呼び出すと表示できます。"> when the action succeeds.</span></p>
  <p class="said" aria-live="polite"></p>
</main>
<script>
const { t, localize } = sakugaSite;
localize();
const el = document.getElementById('el'), el2 = document.getElementById('el2');
const say = (key) => { document.querySelector('.said').textContent = t(key); };
el.addEventListener('click', () => { say('clicked'); setTimeout(() => el.done(), 760); });
el2.addEventListener('click', () => say('canceled'));
</script>
<script src="button.js"></script>
</body>
</html>
