<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-zh="Sakuga 轻提示" data-ja="Sakuga トースト通知">Sakuga Toast</title>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../i18n.css">
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 260px; padding: 40px 0; }
  .hint { margin: 0 4px; color: var(--mute); }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <nav data-language-switch></nav>
  <h1 data-zh="轻提示" data-ja="トースト通知">Toast</h1>
  <p class="sub" data-zh="通知飞入时带着速度线，落定时扬起尘雾。" data-ja="通知がスピード線を引いて飛び込み、砂ぼこりを上げて止まります。">A notification that streaks in and lands in dust.</p>
  <div class="stage">
  <sakuga-button variant="secondary" id="go" data-i18n="save">Save</sakuga-button>
  <sakuga-toast id="el" data-i18n-dismiss-label="dismiss"></sakuga-toast>
  </div>
  <p class="hint" data-zh="点击「保存」。通知会在 2.6 秒后关闭，也可以点击 ✕ 提前关闭。" data-ja="「保存」を押してください。通知は 2.6 秒で消えます。✕ を押すとすぐに閉じられます。">Press Save. The toast stays for 2.6 seconds, or press ✕ to dismiss it.</p>
</main>
<script>
const { t, localize } = sakugaSite;
localize();
const el = document.getElementById('el');
document.getElementById('go').addEventListener('click', () => el.show(t('saved')));
</script>
<script src="toast.js"></script>
<script src="../button/button.js"></script>
</body>
</html>
