<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-zh="Sakuga VFX 组件图库" data-ja="Sakuga VFX コンポーネントギャラリー">Sakuga VFX</title>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../i18n.css">
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; --line: #dcdaf0; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; background: var(--page); }
  body { margin: 0; color: var(--text); background: var(--page); font: 500 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; transition: background .2s, color .2s; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 80px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 14px; }
  h1 { margin: 0; font: italic 800 28px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", system-ui, sans-serif; letter-spacing: -.01em; }
  .lede { max-width: 640px; margin: 8px 0 0; color: var(--mute); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border: 1.5px solid var(--line); border-radius: 999px; background: none; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .pill:hover { border-color: var(--text); }
  :focus-visible { outline: 2.5px solid #ff5fa8; outline-offset: 3px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; margin-top: 28px; grid-auto-flow: dense; }
  .card { display: flex; flex-direction: column; min-width: 0; border: 1.5px solid var(--line); border-radius: 18px; }
  .card.wide { grid-column: span 2; }
  .card h2 { margin: 0; padding: 14px 16px 0; font-size: 15px; font-weight: 700; }
  .card .how { margin: 2px 0 0; padding: 0 16px; color: var(--mute); font-size: 13px; }
  .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; min-height: 230px; padding: 24px 16px; }
  .stage.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 22px; }
  .said { min-height: 1.45em; margin: 0; padding: 0 16px; color: var(--mute); font-size: 13px; text-align: center; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 14px; border-top: 1.5px solid var(--line); margin-top: 10px; }
  .acts .pill { height: 30px; font-size: 12.5px; }
  .pill svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
  .toastwrap { position: relative; display: grid; justify-items: center; gap: 22px; }
  @media (max-width: 680px) { .card.wide { grid-column: auto; } }
</style>
<script src="../button/button.js" defer></script>
<script src="../toggle/toggle.js" defer></script>
<script src="../slider/slider.js" defer></script>
<script src="../checkbox/checkbox.js" defer></script>
<script src="../radio/radio.js" defer></script>
<script src="../input/input.js" defer></script>
<script src="../tabs/tabs.js" defer></script>
<script src="../progress/progress.js" defer></script>
<script src="../rating/rating.js" defer></script>
<script src="../toast/toast.js" defer></script>
<script src="../tooltip/tooltip.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sakuga VFX</h1>
      <p class="lede" data-zh="12 个演示让日常控件像动画一样回应操作：它们会变形、回弹，还会带起烟雾、冲击波、水花和斩击，配上漫画拟声字。每个组件都是一个独立文件，无需依赖。" data-ja="おなじみの UI がアニメのように反応する 12 のデモ。操作に合わせてつぶれたり跳ね返ったりし、煙や衝撃波、水しぶき、斬撃に漫画風の描き文字が重なります。各コンポーネントは依存関係のない単一ファイルです。">Twelve demos of ordinary controls that react like anime: squash and overshoot on springs, and drawn effects (smoke, impact bursts, splashes, slashes) with manga sound-effect lettering. Each component is a single file with no dependencies.</p>
      <p class="links">
        <a class="pill" href="https://github.com/chenlongapps/sakuga-vfx-i18n" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg><span data-zh="GitHub 仓库" data-ja="GitHub リポジトリ">GitHub</span></a>
        <a class="pill" href="https://github.com/chenlongapps/sakuga-vfx-i18n/blob/main/LICENSE" target="_blank" rel="noopener" data-zh="MIT 许可证" data-ja="MIT ライセンス">MIT license</a>
      </p>
    </div>
    <nav data-language-switch></nav>
  </header>
  <main class="grid" id="grid"></main>
</div>
<script>
// The gallery: every control live on one page, with its standalone source file.
const { text, t, link, localize } = sakugaSite;
const ITEMS = [
  { id: 'button', name: text('Primary button', '主按钮', 'プライマリボタン'), how: text('Click it.', '点击按钮。', 'ボタンを押してみてください。'),
    html: '<sakuga-button data-demo="primary" data-i18n="confirm">Confirm</sakuga-button>' },
  { id: 'button', name: text('Secondary button', '次要按钮', 'セカンダリボタン'), how: text('Click it.', '点击按钮。', 'ボタンを押してみてください。'),
    html: '<sakuga-button variant="secondary" data-i18n="cancel">Cancel</sakuga-button>' },
  { id: 'toggle', name: text('Toggle', '开关', 'トグルスイッチ'), how: text('Flip it, then flip it back.', '打开开关，再关上。', 'スイッチをオンにしてから、オフに戻してみてください。'),
    html: '<sakuga-toggle label="Notifications" data-i18n-label="notifications"></sakuga-toggle>' },
  { id: 'slider', name: text('Slider', '滑块', 'スライダー'), how: text('Drag it fast, and let go while it is moving.', '快速拖动滑块，在它移动时松手。', 'つまみをすばやくドラッグし、動かしながら離してみてください。'),
    html: '<sakuga-slider value="30" label="Volume" data-i18n-label="volume"></sakuga-slider>' },
  { id: 'checkbox', name: text('Checkbox', '复选框', 'チェックボックス'), how: text('Tick it.', '勾选复选框。', 'チェックを入れてみてください。'),
    html: '<sakuga-checkbox data-i18n="rememberMe">Remember me</sakuga-checkbox>' },
  { id: 'radio', name: text('Radio', '单选框', 'ラジオボタン'), how: text('Pick the other one.', '选择另一个选项。', 'もう一方の選択肢を選んでみてください。'),
    html: '<sakuga-radio label="Plan" data-i18n-label="plan"><option value="a" selected data-i18n="optionA">Option A</option><option value="b" data-i18n="optionB">Option B</option></sakuga-radio>' },
  { id: 'input', name: text('Text input', '文本输入框', 'テキスト入力欄'), how: text('Click it and type.', '点击输入框并输入文字。', '入力欄をクリックして文字を入力してください。'),
    html: '<sakuga-input label="Text" placeholder="Type something" data-i18n-label="inputText" data-i18n-placeholder="inputPlaceholder"></sakuga-input>' },
  { id: 'tabs', name: text('Tabs', '选项卡', 'タブ'), how: text('Pick another tab, or use the arrow keys.', '点击其他选项卡，或用方向键切换。', '別のタブを選ぶか、矢印キーで切り替えてください。'),
    html: '<sakuga-tabs label="Sections" data-i18n-label="sections"><option value="Home" data-i18n="home">Home</option><option value="Profile" data-i18n="profile">Profile</option><option value="Settings" data-i18n="settings">Settings</option></sakuga-tabs>' },
  { id: 'progress', name: text('Progress', '进度', 'プログレスバー'), how: text('It plays a load by itself, in surges. Click it to start again.', '进度条会自动分段前进，点击可重新开始。', '読み込みが進む様子を自動で再生します。クリックすると最初からやり直せます。'),
    html: '<sakuga-progress demo label="Loading" data-i18n-label="loading" data-i18n-done-label="complete"></sakuga-progress>', wide: true },
  { id: 'rating', name: t('rating'), how: text('Give it five.', '试试点亮五颗星。', '星を 5 つ付けてみてください。'),
    html: '<sakuga-rating label="Rating" data-i18n-label="rating" data-i18n-star-label="starLabel"></sakuga-rating>' },
  { id: 'toast', name: text('Toast', '轻提示', 'トースト通知'), how: text('Press Save.', '点击「保存」。', '「保存」を押してください。'),
    html: '<div class="toastwrap"><sakuga-button variant="secondary" data-demo="save" data-i18n="save">Save</sakuga-button><sakuga-toast data-i18n-dismiss-label="dismiss"></sakuga-toast></div>' },
  { id: 'tooltip', name: text('Tooltip', '工具提示', 'ツールチップ'), how: text('Hover, focus or tap the button.', '将鼠标悬停在按钮上、用键盘聚焦，或轻触按钮。', 'ボタンにマウスを重ねるか、フォーカスするか、タップしてください。'),
    html: '<sakuga-tooltip text="Helpful hint!" data-i18n-text="helpfulHint" data-i18n-label="help"></sakuga-tooltip>' },
];

const grid = document.getElementById('grid');
for (const it of ITEMS) {
  const sourceUrl = `../${it.id}/${it.id}.js`;
  const tag = `sakuga-${it.id}`;
  const card = document.createElement('section'); card.className = 'card' + (it.wide ? ' wide' : '');
  card.innerHTML = `<h2>${it.name}</h2><p class="how">${it.how}</p><div class="stage">${it.html}</div><p class="said" aria-live="polite"></p>
    <div class="acts"><a class="pill" href="${link(`../${it.id}/`)}">${text('Docs and demo', '文档与演示', 'ドキュメントとデモ')}</a><a class="pill" href="${sourceUrl}" download>${text('Download .js', '下载 .js', '.js をダウンロード')}</a><button class="pill" type="button" data-copy-source>${text('Copy source', '复制源码', 'ソースをコピー')}</button></div>`;
  const said = card.querySelector('.said');
  card.querySelector('[data-copy-source]').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    try {
      const response = await fetch(sourceUrl);
      if (!response.ok) throw new Error(`Could not load ${sourceUrl}`);
      await copy(await response.text(), button);
      said.textContent = text('Component source copied.', '已复制组件源码。', 'コンポーネントのソースをコピーしました。');
    } catch {
      said.textContent = text('Could not copy. Use Download .js instead.', '复制失败，请使用「下载 .js」。', 'コピーできませんでした。「.js をダウンロード」をお試しください。');
    }
  });
  grid.append(card);
  const el = card.querySelector(tag), say = (key, value) => { said.textContent = t(key, value); };
  if (it.id === 'button' && el.dataset.demo === 'primary') el.addEventListener('click', () => { say('clicked'); setTimeout(() => el.done(), 760); });
  else if (it.id === 'button') el.addEventListener('click', () => say('canceled'));
  else if (it.id === 'toast') card.querySelector('[data-demo=save]').addEventListener('click', () => el.show(t('saved')));
  else if (it.id === 'progress') el.addEventListener('sakuga:done', () => say('loadingDone'));
  else if (it.id === 'tabs') el.addEventListener('change', (e) => say('tabChanged', e.detail.label));
  else if (it.id === 'toggle') el.addEventListener('change', () => say(el.checked ? 'on' : 'off'));
  else if (it.id === 'checkbox') el.addEventListener('change', () => say(el.checked ? 'checked' : 'unchecked'));
  else if (it.id === 'radio') el.addEventListener('change', () => say('optionChanged', el.querySelector(`option[value="${el.value}"]`).textContent));
  else if (it.id === 'rating') el.addEventListener('change', () => say('ratingChanged', el.value));
  else if (it.id === 'slider' || it.id === 'input') el.addEventListener('change', () => say('valueChanged', el.value));
}
localize();

// Plain HTTP can fall back to copying a selected textarea when the Clipboard API is unavailable.
async function copy(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const restoreFocus = document.activeElement === button;
    const field = Object.assign(document.createElement('textarea'), { value: text });
    field.style.cssText = 'position:fixed;opacity:0';
    document.body.append(field);
    field.select();
    try {
      if (!document.execCommand('copy')) throw new Error('Clipboard unavailable');
    } finally {
      field.remove();
      if (restoreFocus) button.focus({ preventScroll: true });
    }
  }
}
</script>
</body>
</html>
