<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-zh="Sakuga 工具提示" data-ja="Sakuga ツールチップ">Sakuga Tooltip</title>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../i18n.css">
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 260px; padding: 40px 0; }
  .hint { margin: 0 4px; color: var(--mute); }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <nav data-language-switch></nav>
  <h1 data-zh="工具提示" data-ja="ツールチップ">Tooltip</h1>
  <p class="sub" data-zh="提示像漫画里的对话气泡一样弹出。" data-ja="漫画の吹き出しのようにヒントが飛び出します。">A hint that springs out like a speech bubble.</p>
  <div class="stage">
  <sakuga-tooltip id="el" text="Helpful hint!" data-i18n-text="helpfulHint" data-i18n-label="help"></sakuga-tooltip>
  </div>
  <p class="hint" data-zh="将鼠标悬停在按钮上、按 Tab 键聚焦，或轻触按钮。按 Esc 键关闭。" data-ja="ボタンにマウスを重ねるか、Tab キーでフォーカスするか、タップしてください。Esc キーで閉じます。">Hover the button, Tab to it, or tap it. Escape closes it.</p>
</main>
<script>sakugaSite.localize();</script>
<script src="tooltip.js"></script>
</body>
</html>
