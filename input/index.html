<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-zh="Sakuga 文本输入框" data-ja="Sakuga テキスト入力欄">Sakuga Input</title>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../i18n.css">
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 260px; padding: 40px 0; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <nav data-language-switch></nav>
  <h1 data-zh="文本输入框" data-ja="テキスト入力欄">Input</h1>
  <p class="sub" data-zh="输入文字时，光标位置会扬起一小团尘雾。" data-ja="文字を入力すると、カーソルの位置に小さな砂ぼこりが舞います。">A text field that kicks up dust.</p>
  <div class="stage">
  <sakuga-input id="el" label="Name" placeholder="Type something" data-i18n-label="inputName" data-i18n-placeholder="inputPlaceholder"></sakuga-input>
  </div>
  <p class="hint" data-zh="点击输入框并输入文字。" data-ja="入力欄をクリックして文字を入力してください。">Click it and type.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script>
const { t, localize } = sakugaSite;
localize();
const el = document.getElementById('el'), said = document.querySelector('.said');
el.addEventListener('change', () => { said.textContent = t('valueChanged', el.value); });
</script>
<script src="input.js"></script>
</body>
</html>
