<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-zh="Sakuga 进度条" data-ja="Sakuga プログレスバー">Sakuga Progress</title>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../i18n.css">
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 260px; padding: 40px 0; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .drive { display: flex; align-items: center; gap: 10px; margin: 14px 4px 0; color: var(--mute); font-size: 13px; } .drive input { flex: 1; }
  code { font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <nav data-language-switch></nav>
  <h1 data-zh="进度条" data-ja="プログレスバー">Progress</h1>
  <p class="sub" data-zh="一团风暴云会跟着加载进度条向前移动。" data-ja="プログレスバーの先端に雷雲が乗って進みます。">A loading bar with a storm cloud riding its edge.</p>
  <div class="stage">
  <sakuga-progress id="el" demo label="Loading" data-i18n-label="loading" data-i18n-done-label="complete"></sakuga-progress>
  </div>
  <p class="hint" data-zh="演示会模拟分段加载。点击进度条可重新开始，也可以拖动下方的滑块手动调整。" data-ja="読み込みが加速と減速を繰り返すデモです。バーをクリックすると最初から再生でき、下のスライダーで進捗を調整できます。">It plays a pretend load in surges. Click it to start again, or drag the slider under it to drive it yourself.</p>
  <label class="drive" id="drive" hidden><span data-i18n="progress">Progress</span> <input type="range" min="0" max="100" value="0"></label>
  <p class="said" aria-live="polite"></p>
</main>
<script>
const { t, localize } = sakugaSite;
localize();
const el = document.getElementById('el'), said = document.querySelector('.said');
el.addEventListener('sakuga:done', () => { said.textContent = t('loadingDone'); });
</script>
<script src="progress.js"></script>
<script>
const drive = document.getElementById('drive');
drive.hidden = false; drive.querySelector('input').addEventListener('input', (e) => { el.removeAttribute('demo'); el.set(e.target.value / 100); });
</script>
</body>
</html>
